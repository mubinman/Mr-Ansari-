<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

/* =========================
   BACKGROUND WEBSITE
========================= */

#background-site {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 1;
    background: #fff;
}

/* =========================
   FLOATING WRAPPER
========================= */

#main-wrapper {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 190px;
    height: 190px;

    transform: translate(-50%, -50%);

    z-index: 9999;

    touch-action: none;
}

/* =========================
   MAIN PANEL
========================= */

#main {
    width: 100%;
    height: 100%;

    background-color: rgba(26, 0, 0, 0.96);

    border: 3px solid #ff0000;
    border-radius: 20px;

    display: flex;
    flex-direction: column;
    gap: 4px;

    position: relative;
    padding: 6px;

    animation: animatedGlow 1.5s infinite ease-in-out;

    overflow: hidden;

    resize: both;
    min-width: 170px;
    min-height: 170px;
    max-width: 90vw;
    max-height: 80vh;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes animatedGlow {
    0%,100% {
        box-shadow:
            0 0 10px #ff0000,
            inset 0 0 10px #ff0000;

        border-color: #ff0000;
    }

    50% {
        box-shadow:
            0 0 18px #ff6666,
            inset 0 0 10px #ff4d4d;

        border-color: #ffffff;
    }
}

@keyframes spinLoader {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

@keyframes spinLoaderRev {
    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}

@keyframes blink {
    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .3;
    }
}

/* =========================
   GRID
========================= */

.grid-bg {
    position: absolute;
    inset: 0;

    border-radius: 17px;

    background:
        repeating-linear-gradient(
            45deg,
            rgba(255,0,0,.08) 0,
            rgba(255,0,0,.08) 1px,
            transparent 1px,
            transparent 15px
        );

    z-index: 0;
    pointer-events: none;
}

/* =========================
   DRAG HEADER
========================= */

.header {
    display: flex;
    justify-content: center;
    align-items: center;

    width: 100%;

    z-index: 20;

    cursor: move;

    touch-action: none;

    padding: 2px 0;
}

.title-text {
    font-family: 'Creepster', cursive;

    font-size: 11px;

    color: #fff;

    text-shadow: 0 0 8px #ff0000;

    letter-spacing: 2px;

    text-align: center;

    width: 100%;
}

/* =========================
   SYSTEM BAR
========================= */

.sys-bar {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: rgba(0,0,0,.85);

    border: 1px solid rgba(255,0,0,.3);

    border-radius: 15px;

    padding: 2px 6px;

    color: #fff;

    font-family: 'Orbitron', sans-serif;

    font-size: 7px;

    font-weight: 700;

    text-shadow: 0 0 5px #ff0000;

    z-index: 2;
}

.live-dot {
    display: inline-block;

    width: 5px;
    height: 5px;

    background: #ff0000;

    border-radius: 50%;

    animation: blink 1s infinite;

    margin-right: 4px;
}

/* =========================
   CONTENT
========================= */

#content {
    flex: 1;

    display: flex;

    flex-direction: column;

    gap: 10px;

    z-index: 2;

    width: 100%;

    min-height: 0;
}

.ai-result-box {
    width: 100%;

    flex: 1;

    border: 1px solid rgba(255,0,0,.4);

    border-radius: 12px;

    padding: 4px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    position: relative;

    background: rgba(26,0,0,.95);
}

/* =========================
   RESULT
========================= */

.spider-ring {
    width: 32px;
    height: 32px;

    border-radius: 50%;

    border: 2px solid #ff0000;

    background: #000;

    display: flex;

    align-items: center;

    justify-content: center;

    animation: animatedGlow 1.5s infinite ease-in-out;

    z-index: 20;
}

.text-group {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 2px;
}

.status-title {
    font-family: 'Creepster', cursive;

    font-size: 12px;

    color: #fff;

    text-shadow: 0 0 8px rgba(255,0,0,.8);

    letter-spacing: 2px;

    text-align: center;
}

.status-sub {
    font-family: 'Orbitron', sans-serif;

    font-size: 8px;

    font-weight: 800;

    color: #ff8080;

    letter-spacing: 1px;

    text-align: center;
}

.status-desc {
    font-family: 'Rajdhani', sans-serif;

    font-size: 7px;

    font-weight: 600;

    color: #ffcccc;

    text-align: center;

    letter-spacing: .5px;
}

/* =========================
   BUTTONS
========================= */

.buttons-area {
    display: flex;

    gap: 10px;

    width: 100%;

    z-index: 2;
}

.btn {
    flex: 1;

    padding: 5px 0;

    border-radius: 10px;

    font-family: 'Creepster', cursive;

    font-size: 16px;

    letter-spacing: 1.5px;

    cursor: pointer;

    border: none;

    transition: transform .1s;
}

.btn:active {
    transform: scale(.95);
}

.btn-action {
    background:
        linear-gradient(
            180deg,
            #ff3333 0%,
            #990000 100%
        );

    color: #fff;

    box-shadow:
        0 0 8px rgba(255,0,0,.6);
}

.btn-hide {
    background: #1a1a1a;

    color: #fff;

    border: 1px solid #333;
}

/* =========================
   PROGRESS
========================= */

.progress-bar {
    width: 85%;

    height: 3px;

    background: rgba(255,0,0,.2);

    border-radius: 3px;

    overflow: hidden;
}

.progress-fill {
    height: 100%;

    background: #ff0000;

    border-radius: 3px;

    box-shadow: 0 0 8px #ff0000;

    transition: width .03s linear;
}

/* =========================
   RESULT NUMBER
========================= */

.ai-result-row {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;
}

.text-result {
    color: #fff;

    font-family: 'Creepster', cursive;

    font-size: 26px;

    text-shadow: 0 0 10px #ff0000;

    letter-spacing: 2px;

    text-transform: uppercase;

    line-height: 1;
}

.num-container {
    position: relative;

    width: 28px;
    height: 28px;

    display: flex;

    align-items: center;

    justify-content: center;
}

.result-num {
    width: 28px;
    height: 28px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #000;

    border: 2px solid #ff0000;

    color: #fff;

    font-family: 'Orbitron', sans-serif;

    font-size: 13px;

    font-weight: 900;

    box-shadow: 0 0 8px #ff0000;
}

/* =========================
   PERIOD
========================= */

.period-wrapper {
    width: 100%;

    display: flex;

    justify-content: center;

    z-index: 2;
}

.glass-period-box {
    background: rgba(0,0,0,.85);

    border: 1px solid rgba(255,0,0,.4);

    border-radius: 15px;

    padding: 1px 8px;

    color: #fff;

    font-family: 'Orbitron', sans-serif;

    font-size: 7px;

    font-weight: 700;

    letter-spacing: 1px;

    text-shadow: 0 0 5px #ff0000;

    text-align: center;
}

/* =========================
   LOADING RINGS
========================= */

.loading-ring {
    position: absolute;

    border-radius: 50%;

    pointer-events: none;
}

.ring-1 {
    width: 40px;
    height: 40px;

    border: 2px solid transparent;

    border-top: 2px solid #fff;

    border-left: 2px solid #ff0000;

    animation: spinLoader 1s linear infinite;

    z-index: 10;
}

.ring-2 {
    width: 48px;
    height: 48px;

    border: 2px dashed transparent;

    border-bottom: 2px dashed #ff6666;

    border-right: 2px dashed #fff;

    animation: spinLoaderRev 1.5s linear infinite;

    z-index: 9;
}

/* =========================
   CLOSE BUTTON
========================= */

#close-panel {
    position: absolute;

    top: 4px;
    right: 6px;

    width: 18px;
    height: 18px;

    border-radius: 50%;

    border: 1px solid #ff0000;

    background: #150000;

    color: #fff;

    font-family: Arial, sans-serif;

    font-size: 11px;

    line-height: 15px;

    text-align: center;

    cursor: pointer;

    z-index: 100;
}

/* =========================
   SHOW PANEL BUTTON
========================= */

#show-panel {
    display: none;

    position: fixed;

    right: 12px;
    bottom: 12px;

    z-index: 10000;

    border: 1px solid #ff0000;

    background: #190000;

    color: #fff;

    border-radius: 10px;

    padding: 8px 12px;

    font-family: 'Orbitron', sans-serif;

    font-size: 10px;

    box-shadow: 0 0 10px #ff0000;
}
</style>
</head>

<body>

<!-- BACKGROUND WEBSITE -->
<iframe
    id="background-site"
    src="https://www.b9082z.com/#/register?invitationCode=677176218147"
    allow="fullscreen">
</iframe>


<!-- FLOATING DEMO PANEL -->

<div id="main-wrapper">

    <div id="main">

        <div class="grid-bg"></div>

        <button id="close-panel">×</button>

        <div class="header" id="drag-handle">
            <div class="title-text">
                LZR EGO PREDICTOR
            </div>
        </div>

        <div class="sys-bar">

            <div>
                <span class="live-dot"></span>
                LIVE
            </div>

            <div>
                6CLUB MODE
            </div>

            <div id="ping-text">
                PING : 20MS
            </div>

        </div>

        <div id="content"></div>

    </div>

</div>

<button id="show-panel">
    SHOW RESULT
</button>


<script>

/* =====================================
   DEMO VARIABLES
===================================== */

let isScanning = false;

let currentResultSz = "BIG";

let currentResultNum = "8";

let currentPeriod = null;


/* =====================================
   PERIOD
===================================== */

function getPeriod() {

    const now = new Date();

    const total =
        now.getHours() * 60 +
        now.getMinutes();

    return String(10001 + total).slice(-5);
}


/* =====================================
   GENERATE DEMO RESULT
===================================== */

function generateDemoResult() {

    if (isScanning) {
        return;
    }

    isScanning = true;

    currentPeriod = getPeriod();

    renderScanning();

    setTimeout(function() {

        const n =
            Math.floor(
                Math.random() * 10
            );

        currentResultNum =
            String(n);

        currentResultSz =
            n <= 4
                ? "SMALL"
                : "BIG";

        isScanning = false;

        renderResult();

    }, 3000);
}


/* =====================================
   SCANNING
===================================== */

function renderScanning() {

    const cont =
        document.getElementById("content");

    cont.innerHTML = `

        <div class="ai-result-box">

            <div style="
                position:relative;
                display:flex;
                align-items:center;
                justify-content:center;
                width:50px;
                height:50px;
            ">

                <div class="loading-ring ring-1"></div>

                <div class="loading-ring ring-2"></div>

                <div class="spider-ring">

                    <div class="result-num">
                        ?
                    </div>

                </div>

            </div>

            <div class="text-group">

                <div
                    class="status-sub"
                    id="prog-txt"
                    style="font-size:16px;"
                >
                    0%
                </div>

                <div class="status-desc">
                    GENERATING RESULT
                </div>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="prog-fill"
                    style="width:0%;"
                ></div>

            </div>

        </div>

        <div class="buttons-area">

            <button class="btn btn-action">
                WAIT
            </button>

            <button
                class="btn btn-hide"
                onclick="location.reload()"
            >
                RESET
            </button>

        </div>
    `;

    let p = 0;

    if (window.progInt) {
        clearInterval(window.progInt);
    }

    window.progInt =
        setInterval(function() {

            p++;

            const txt =
                document.getElementById(
                    "prog-txt"
                );

            const fill =
                document.getElementById(
                    "prog-fill"
                );

            if (txt && fill) {

                txt.innerText =
                    p + "%";

                fill.style.width =
                    p + "%";
            }

            if (p >= 100) {

                clearInterval(
                    window.progInt
                );
            }

        }, 30);
}


/* =====================================
   RESULT
===================================== */

function renderResult() {

    const cont =
        document.getElementById("content");

    const last5 =
        currentPeriod
            ? currentPeriod.slice(-5)
            : getPeriod().slice(-5);

    cont.innerHTML = `

        <div class="ai-result-box">

            <div class="ai-result-row">

                <div class="text-result">
                    ${currentResultSz}
                </div>

                <div class="num-container">

                    <div class="result-num">
                        ${currentResultNum}
                    </div>

                </div>

            </div>

            <div class="period-wrapper">

                <div class="glass-period-box">

                    PERIOD NO :
                    ${last5}

                </div>

            </div>

        </div>

        <div class="buttons-area">

            <button
                class="btn btn-action"
                onclick="generateDemoResult()"
            >
                NEXT
            </button>

            <button
                class="btn btn-hide"
                onclick="location.reload()"
            >
                HIDE
            </button>

        </div>
    `;
}


/* =====================================
   START SCREEN
===================================== */

function renderStart() {

    const cont =
        document.getElementById("content");

    cont.innerHTML = `

        <div class="ai-result-box">

            <div class="spider-ring">

                <div class="result-num">
                    ?
                </div>

            </div>

            <div class="text-group">

                <div class="status-title">
                    RESULT READY
                </div>

                <div class="status-sub">
                    NUMBER AI MODE
                </div>

                <div class="status-desc">
                    SURESHOT ONLY
                </div>

            </div>

        </div>

        <div class="buttons-area">

            <button
                class="btn btn-action"
                onclick="generateDemoResult()"
            >
                START
            </button>

            <button
                class="btn btn-hide"
                onclick="location.reload()"
            >
                HIDE
            </button>

        </div>
    `;
}


/* =====================================
   PING
===================================== */

setInterval(function() {

    const pt =
        document.getElementById(
            "ping-text"
        );

    if (pt) {

        pt.innerText =
            "PING : " +
            (
                Math.floor(
                    Math.random() * 20
                ) + 20
            ) +
            "MS";
    }

}, 1500);


/* =====================================
   DRAG SYSTEM
===================================== */

const wrapper =
    document.getElementById(
        "main-wrapper"
    );

const handle =
    document.getElementById(
        "drag-handle"
    );

let dragging = false;

let startX = 0;
let startY = 0;

let startLeft = 0;
let startTop = 0;


function startDrag(e) {

    dragging = true;

    const point =
        e.touches
            ? e.touches[0]
            : e;

    const rect =
        wrapper.getBoundingClientRect();

    startX = point.clientX;
    startY = point.clientY;

    startLeft = rect.left;
    startTop = rect.top;

    wrapper.style.transform = "none";

    e.preventDefault();
}


function moveDrag(e) {

    if (!dragging) {
        return;
    }

    const point =
        e.touches
            ? e.touches[0]
            : e;

    let newLeft =
        startLeft +
        (point.clientX - startX);

    let newTop =
        startTop +
        (point.clientY - startY);

    const width =
        wrapper.offsetWidth;

    const height =
        wrapper.offsetHeight;

    newLeft =
        Math.max(
            0,
            Math.min(
                window.innerWidth - width,
                newLeft
            )
        );

    newTop =
        Math.max(
            0,
            Math.min(
                window.innerHeight - height,
                newTop
            )
        );

    wrapper.style.left =
        newLeft + "px";

    wrapper.style.top =
        newTop + "px";
}


function stopDrag() {

    dragging = false;
}


handle.addEventListener(
    "mousedown",
    startDrag
);

document.addEventListener(
    "mousemove",
    moveDrag
);

document.addEventListener(
    "mouseup",
    stopDrag
);


handle.addEventListener(
    "touchstart",
    startDrag,
    {passive:false}
);

document.addEventListener(
    "touchmove",
    moveDrag,
    {passive:false}
);

document.addEventListener(
    "touchend",
    stopDrag
);


/* =====================================
   CLOSE / SHOW
===================================== */

const closeBtn =
    document.getElementById(
        "close-panel"
    );

const showBtn =
    document.getElementById(
        "show-panel"
    );


closeBtn.onclick = function() {

    wrapper.style.display = "none";

    showBtn.style.display = "block";
};


showBtn.onclick = function() {

    wrapper.style.display = "block";

    showBtn.style.display = "none";
};


/* =====================================
   START
===================================== */

window.onload = function() {

    renderStart();

};

</script>

</body>
</html>
